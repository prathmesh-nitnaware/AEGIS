# ===========================================================================
# AEGIS nginx reverse-proxy config for the React dashboard container
# docker/nginx.conf
# ===========================================================================
# This file is copied into /etc/nginx/conf.d/ inside Dockerfile.dashboard.
# It:
#   1. Serves the built React SPA on port 80
#   2. Proxies /api/* REST calls to the Command Node backend
#   3. Proxies /ws/telemetry WebSocket upgrade to the Command Node

upstream command_node {
    server command-node:8000;
}

server {
    listen 80;
    server_name _;

    # --------------------------------------------------------------------------
    # Serve the SPA — all routes fall back to index.html (React Router support)
    # --------------------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # WebSocket reverse-proxy — /ws/*  →  command-node:8000
    # --------------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://command_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --------------------------------------------------------------------------
    # REST API reverse-proxy — /api/*  →  command-node:8000
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://command_node;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Gzip compression for assets
    # --------------------------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
}
