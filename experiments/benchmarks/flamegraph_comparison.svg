<svg version="1.1" width="1000" height="420" xmlns="http://www.w3.org/2000/svg" style="background:#0b0f19; font-family:sans-serif;">
  <style>
    .title { fill: #f8fafc; font-size: 18px; font-weight: bold; }
    .subtitle { fill: #94a3b8; font-size: 12px; }
    .box-user { fill: #ef4444; stroke: #7f1d1d; rx: 3; }
    .box-ebpf { fill: #10b981; stroke: #064e3b; rx: 3; }
    .box-idle { fill: #334155; stroke: #1e293b; rx: 3; }
    .box-kernel { fill: #3b82f6; stroke: #1e3a8a; rx: 3; }
    .text-light { fill: #ffffff; font-size: 11px; font-weight: 600; text-anchor: middle; }
  </style>

  <!-- Title & Header -->
  <text x="500" y="32" class="title" text-anchor="middle">AEGIS CPU Flamegraph: Userspace Polling vs eBPF Kernel Tracer</text>
  <text x="500" y="52" class="subtitle" text-anchor="middle">Comparing CPU Core Budget Allocation under 50,000 Events/sec Ingestion Load</text>

  <!-- Section 1: Userspace Polling Flame Stack (Left) -->
  <text x="250" y="85" class="title" style="font-size:14px; fill:#fca5a5;" text-anchor="middle">Userspace Polling (14.8% CPU Overhead)</text>
  
  <!-- Base frame -->
  <rect x="50" y="100" width="400" height="35" class="box-user"/>
  <text x="250" y="122" class="text-light">python3 / agent_runner.py (100% thread cpu)</text>

  <rect x="50" y="140" width="220" height="35" class="box-user" style="fill:#f97316; stroke:#9a3412;"/>
  <text x="160" y="162" class="text-light">procfs_scanner.py:read_proc() (55%)</text>

  <rect x="275" y="140" width="175" height="35" class="box-user" style="fill:#dc2626; stroke:#7f1d1d;"/>
  <text x="362" y="162" class="text-light">json.loads &amp; regex (45%)</text>

  <rect x="50" y="180" width="140" height="35" class="box-kernel"/>
  <text x="120" y="202" class="text-light">sys_openat / vfs_read</text>

  <rect x="195" y="180" width="75" height="35" class="box-kernel" style="fill:#6366f1;"/>
  <text x="232" y="202" class="text-light">ctx_switch</text>

  <!-- Section 2: eBPF Kernel Tracer Flame Stack (Right) -->
  <text x="730" y="85" class="title" style="font-size:14px; fill:#6ee7b7;" text-anchor="middle">eBPF Kernel Ring-Buffer (1.2% CPU Overhead)</text>

  <!-- Base frame (Mostly Idle) -->
  <rect x="530" y="100" width="370" height="35" class="box-idle"/>
  <text x="715" y="122" class="text-light" style="fill:#94a3b8;">System CPU Idle / Available for SOC Analytics (98.8%)</text>

  <rect x="905" y="100" width="45" height="35" class="box-ebpf"/>
  <text x="927" y="122" class="text-light">eBPF</text>

  <rect x="905" y="140" width="45" height="35" class="box-ebpf" style="fill:#059669; stroke:#065f46;"/>
  <text x="927" y="162" class="text-light" style="font-size:9px;">ring_buf</text>

  <rect x="905" y="180" width="45" height="35" class="box-ebpf" style="fill:#34d399; stroke:#059669;"/>
  <text x="927" y="202" class="text-light" style="font-size:8px;">tracepoint</text>

  <!-- Footer summary cards -->
  <rect x="50" y="250" width="400" height="130" rx="8" style="fill:#1e1e2f; stroke:#374151; stroke-width:1;"/>
  <text x="70" y="280" class="text-light" style="fill:#f87171; text-anchor:start; font-size:13px;">Traditional Polling Bottlenecks:</text>
  <text x="70" y="305" class="subtitle" style="fill:#cbd5e1;">- High kernel-to-user context switching (4,820/s)</text>
  <text x="70" y="325" class="subtitle" style="fill:#cbd5e1;">- Expensive repeated disk/proc parsing</text>
  <text x="70" y="345" class="subtitle" style="fill:#cbd5e1;">- CPU Overhead: ~14.8% of dedicated core</text>

  <rect x="530" y="250" width="420" height="130" rx="8" style="fill:#1e1e2f; stroke:#374151; stroke-width:1;"/>
  <text x="550" y="280" class="text-light" style="fill:#34d399; text-anchor:start; font-size:13px;">AEGIS eBPF Optimization Gains:</text>
  <text x="550" y="305" class="subtitle" style="fill:#cbd5e1;">- Direct in-kernel ring-buffer memory push</text>
  <text x="550" y="325" class="subtitle" style="fill:#cbd5e1;">- Context switch reduction (97.5% fewer switches)</text>
  <text x="550" y="345" class="subtitle" style="fill:#cbd5e1;">- CPU Overhead: &lt; 1.2% (12.3x efficiency gain)</text>
</svg>